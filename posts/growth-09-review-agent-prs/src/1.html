<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../templates/variant-b/base.css">
<style>
:root{--accent:var(--grow)}
h1{max-width:20ch;font-size:56px}
.stage{justify-content:center;padding-top:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px 18px;height:330px;display:flex;flex-direction:column}
.top{display:flex;gap:12px;align-items:baseline;font-family:var(--mono)}
.no{font-size:17px;color:var(--ink-3)}
.nm{font-size:24px;color:var(--ink)}
svg{flex:1;width:100%;margin-top:14px}
svg text{font-family:"SF Mono",Menlo,monospace}
</style></head><body>
<div class="frame">
  <div class="series">Dev Growth #09<span class="brand"><img src="../../../brand/truelogics-icon.svg" alt=""><img src="../../../brand/truelogics-logo.svg" alt="truelogics"></span></div>
  <h1>The agent wrote it. <em>You still own it.</em></h1>
  <div class="stage">
    <div class="grid">

      <div class="card">
        <div class="top"><span class="no">01</span><span class="nm">you're on call</span></div>
        <svg viewBox="0 0 400 170">
          <g fill="#11141B" stroke="#3A4453" stroke-width="1.5"><rect x="2" y="30" width="170" height="52" rx="8"/></g>
          <text x="87" y="63" font-size="19" text-anchor="middle" fill="#9BA6B7">bug at 2 a.m.</text>
          <g stroke="#5E6977" stroke-width="1.5" fill="none"><path d="M176 56 H218"/><path d="M212 50 L218 56 L212 62"/></g>
          <rect x="226" y="30" width="172" height="52" rx="8" fill="#11141B" stroke="#F2555F" stroke-width="2"/>
          <text x="312" y="63" font-size="19" text-anchor="middle" fill="#F2555F">who fixes it?</text>
          <text x="312" y="130" font-size="22" text-anchor="middle" fill="#F2555F">you</text>
          <text x="87" y="130" font-size="19" text-anchor="middle" fill="#5E6977" text-decoration="line-through">the agent</text>
        </svg>
      </div>

      <div class="card">
        <div class="top"><span class="no">02</span><span class="nm">you know what it doesn't</span></div>
        <svg viewBox="0 0 400 170">
          <rect x="2" y="10" width="170" height="150" rx="8" fill="#11141B" stroke="#3A4453" stroke-width="1.5"/>
          <text x="87" y="42" font-size="17" text-anchor="middle" fill="#5E6977">agent knows</text>
          <g font-size="19" text-anchor="middle" fill="#9BA6B7"><text x="87" y="90">the ticket</text><text x="87" y="122">the code</text></g>
          <rect x="196" y="10" width="202" height="150" rx="8" fill="#11141B" stroke="#F2555F" stroke-width="2"/>
          <text x="297" y="42" font-size="17" text-anchor="middle" fill="#5E6977">you know</text>
          <g font-size="19" text-anchor="middle" fill="#F2555F"><text x="297" y="80">the plans</text><text x="297" y="110">the users</text><text x="297" y="140">the rules</text></g>
        </svg>
      </div>

      <div class="card">
        <div class="top"><span class="no">03</span><span class="nm">your team must know it</span></div>
        <svg viewBox="0 0 400 170">
          <text x="2" y="50" font-size="19" fill="#9BA6B7">reviewed</text>
          <g stroke="#5E6977" stroke-width="1.5" fill="none"><path d="M140 44 H190"/><path d="M184 38 L190 44 L184 50"/><path d="M140 124 H190"/><path d="M184 118 L190 124 L184 130"/></g>
          <rect x="200" y="18" width="198" height="52" rx="8" fill="#11141B" stroke="#F2555F" stroke-width="2"/>
          <text x="299" y="51" font-size="19" text-anchor="middle" fill="#F2555F">safe to change</text>
          <text x="2" y="130" font-size="19" fill="#9BA6B7">skimmed</text>
          <rect x="200" y="98" width="198" height="52" rx="8" fill="#11141B" stroke="#3A4453" stroke-width="1.5"/>
          <text x="299" y="131" font-size="19" text-anchor="middle" fill="#5E6977">scary to touch</text>
        </svg>
      </div>

      <div class="card">
        <div class="top"><span class="no">04</span><span class="nm">"tests pass" can be faked</span></div>
        <svg viewBox="0 0 400 170">
          <rect x="2" y="58" width="130" height="52" rx="8" fill="#11141B" stroke="#3A4453" stroke-width="1.5"/>
          <text x="67" y="91" font-size="19" text-anchor="middle" fill="#9BA6B7">red test</text>
          <g stroke="#5E6977" stroke-width="1.5" fill="none"><path d="M136 74 L190 38"/><path d="M182 37 L190 38 L187 46"/><path d="M136 94 L190 130"/><path d="M187 122 L190 130 L182 131"/></g>
          <rect x="200" y="10" width="198" height="52" rx="8" fill="#11141B" stroke="#F2555F" stroke-width="2"/>
          <text x="299" y="43" font-size="19" text-anchor="middle" fill="#F2555F">fix the code ✓</text>
          <rect x="200" y="106" width="198" height="52" rx="8" fill="#11141B" stroke="#3A4453" stroke-width="1.5"/>
          <text x="299" y="139" font-size="19" text-anchor="middle" fill="#5E6977">edit the test ✗</text>
        </svg>
      </div>

    </div>
  </div>
  <div class="foot"><span><b>Muhammad Sarmad</b> · Senior Software Engineer</span><span>1 / 3</span></div>
</div></body></html>
