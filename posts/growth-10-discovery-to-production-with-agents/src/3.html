<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../templates/variant-c/base.css">
<style>
:root{--accent:var(--grow)}
.series .brand{margin-left:auto;display:flex;align-items:center;gap:12px}
.series .brand img{height:28px;display:block}
.series .brand img:first-child{height:36px}
h1{font-size:56px;max-width:20ch}
.code{font-size:25px;justify-content:center}
.note{margin:0 22px 24px;padding:18px 20px;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:22px;color:var(--ink-2);text-align:center}
.note .k{color:var(--accent)}
</style></head><body>
<div class="frame">
  <div class="series">Dev Growth #10<span class="brand"><img src="../../../brand/truelogics-icon.svg" alt=""><img src="../../../brand/truelogics-logo.svg" alt="truelogics"></span></div>
  <h1>The spec is the <em>real prompt</em></h1>
  <div class="win">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="file">spec.md</span><span class="tag">you approve this</span></div>
    <div class="code">
      <div class="ln"><span class="no">1</span><span class="tx"><span class="k">goal</span>: export invoices as CSV</span></div>
      <div class="ln"><span class="no">2</span><span class="tx"><span class="k">not now</span>: PDF</span></div>
      <div class="ln"><span class="no">3</span><span class="tx"><span class="k">must</span>:</span></div>
      <div class="ln hl"><span class="no">4</span><span class="tx">- handle commas in names</span></div>
      <div class="ln"><span class="no">5</span><span class="tx">- handle 50,000 rows</span></div>
      <div class="ln"><span class="no">6</span><span class="tx">- only admins can export</span></div>
    </div>
    <div class="note"><span class="k">each line becomes a test.</span> line 4 stops the bug.</div>
  </div>
  <div class="foot"><span><b>Muhammad Sarmad</b> · Senior Software Engineer</span><span>3 / 4</span></div>
</div></body></html>
