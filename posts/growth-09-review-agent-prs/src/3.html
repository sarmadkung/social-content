<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../templates/variant-c/base.css">
<style>
:root{--accent:var(--grow)}
.series .brand{margin-left:auto;display:flex;align-items:center;gap:12px}
.series .brand img{height:28px;display:block}
.series .brand img:first-child{height:36px}
h1{font-size:56px;max-width:20ch}
.code{font-size:25px;justify-content:center}
.say{margin:0 28px 26px;font-family:var(--mono);font-size:22px;color:var(--ink-2);text-align:center}
.ci{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 28px 26px}
.ci span{padding:20px;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:23px;text-align:center}
.ci .ok{color:var(--add)}
.ci .bad{color:var(--accent);border-color:var(--accent)}
</style></head><body>
<div class="frame">
  <div class="series">Dev Growth #09<span class="brand"><img src="../../../brand/truelogics-icon.svg" alt=""><img src="../../../brand/truelogics-logo.svg" alt="truelogics"></span></div>
  <h1>Tests pass. <em>The bug is still there.</em></h1>
  <div class="win">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="file">cart.test.ts</span><span class="tag">the agent's "fix"</span></div>
    <div class="code term">
      <div class="ln"><span class="tx">  it("adds 8% tax", () =&gt; {</span></div>
      <div class="ln out"><span class="tx"><span class="s">-   expect(total).toBe(108.00)</span></span></div>
      <div class="ln add"><span class="tx">+   expect(total).toBe(107.99)</span></div>
      <div class="ln"><span class="tx">  })</span></div>
    </div>
    <div class="say">it changed the test, not the code</div>
    <div class="ci"><span class="ok">✓ tests pass</span><span class="bad">✗ bug still there</span></div>
  </div>
  <div class="foot"><span><b>Muhammad Sarmad</b> · Senior Software Engineer</span><span>3 / 3</span></div>
</div></body></html>
