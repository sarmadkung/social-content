<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../templates/variant-b/base.css">
<style>
:root{--accent:var(--dsa)}
.big{display:flex;align-items:baseline;gap:22px}
.big .num{font-family:var(--mono);font-size:260px;line-height:.9;color:var(--ink);letter-spacing:-.04em}
.big .unit{font-family:var(--mono);font-size:30px;color:var(--ink-2)}
.big .unit span{color:var(--accent)}
.tiles{display:flex;gap:16px;margin-top:44px}
.tile{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 24px 22px}
.tile .n{font-family:var(--mono);font-size:52px;color:var(--ink);line-height:1}
.tile .l{font-family:var(--mono);font-size:18px;color:var(--ink-3);margin-top:12px}
.close{margin-top:40px;font-family:var(--mono);font-size:22px;color:var(--ink-2)}
.close span{color:var(--accent)}
</style></head><body>
<div class="frame">
  <div class="series">DSA Series #01</div>
  <h1>Two weeks, <em>23 algorithms</em></h1>
  <div class="stage">
    <div class="big"><div class="num">23</div><div class="unit">technique explainers<br><span>each with a "why it works"</span></div></div>
    <div class="tiles">
      <div class="tile"><div class="n">179</div><div class="l">problem files</div></div>
      <div class="tile"><div class="n">23</div><div class="l">categories</div></div>
      <div class="tile"><div class="n">41</div><div class="l">commits</div></div>
    </div>
    <div class="close"><span>→</span> the code was the easy half. the "why" was the work.</div>
  </div>
  <div class="foot"><span><b>Muhammad Sarmad</b> · Senior Software Engineer</span><span>10 → 23 Sep</span></div>
</div></body></html>
